[package]
name = "statusline"
version = "2.1.1"
edition = "2021"
rust-version = "1.89"
description = "Fast, dependency-free status line for Claude Code: context window, 5-hour and 7-day quotas, model, RAM, disk and CPU. Windows, Linux and macOS."
license = "MIT"
repository = "https://github.com/LetermeFlorent/claude-statusline"
publish = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = true
