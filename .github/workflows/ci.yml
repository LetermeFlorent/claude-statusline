name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: statusline-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: statusline-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: statusline-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: statusline-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: statusline-windows-x86_64.exe
            test_rustflags: -Cdebuginfo=0
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: statusline-windows-arm64.exe
            test_rustflags: -Cdebuginfo=0
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" = "$GITHUB_REF_NAME"

      - name: rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --no-self-update --profile minimal -c rustfmt,clippy -t ${{ matrix.target }}

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        env:
          RUSTFLAGS: ${{ matrix.test_rustflags }}
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: unit tests
        env:
          RUSTFLAGS: ${{ matrix.test_rustflags }}
        run: cargo test --locked --target ${{ matrix.target }} -- --include-ignored

      - name: release build
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir dist
          ext=""
          [ "$RUNNER_OS" = Windows ] && ext=.exe
          cp "target/${{ matrix.target }}/release/statusline$ext" "dist/${{ matrix.asset }}"
          ls -l dist

      - name: binary hardening
        if: runner.os == 'Windows' || matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          b="dist/${{ matrix.asset }}"
          if [ "$RUNNER_OS" = Windows ]; then
            rustup component add llvm-tools
            host=$(rustc -vV | sed -n 's/^host: //p')
            readobj="$(cygpath -u "$(rustc --print sysroot)")/lib/rustlib/$host/bin/llvm-readobj"
            headers=$("$readobj" --file-headers --coff-debug-directory "$b")
            flags="DYNAMIC_BASE HIGH_ENTROPY_VA NX_COMPAT"
            [ "${{ matrix.target }}" = x86_64-pc-windows-msvc ] && flags="$flags EX_CET_COMPAT"
            for flag in $flags; do
              grep -q "IMAGE_DLL_CHARACTERISTICS_$flag" <<< "$headers" || { echo "missing $flag"; exit 1; }
            done
          else
            grep -q 'Type:.*DYN' <<< "$(readelf -h "$b")"
          fi

      - name: rebuild check
        run: |
          copy="$RUNNER_TEMP/rebuild"
          mkdir "$copy"
          git archive HEAD | (cd "$copy" && tar -xf -)
          ext=""
          [ "$RUNNER_OS" = Windows ] && ext=.exe
          (cd "$copy" && cargo build --release --locked --target ${{ matrix.target }})
          rebuilt="$copy/target/${{ matrix.target }}/release/statusline$ext"
          shipped="dist/${{ matrix.asset }}"
          cmp "$rebuilt" "$shipped" || { ls -l "$rebuilt" "$shipped"; cmp -l "$rebuilt" "$shipped" | head -n 40; exit 1; }

      - name: binary smoke test
        run: |
          b="dist/${{ matrix.asset }}"
          export HOME="$RUNNER_TEMP/h" USERPROFILE="$RUNNER_TEMP/h" LOCALAPPDATA="$RUNNER_TEMP/h/local" XDG_STATE_HOME="$RUNNER_TEMP/h/state"
          mkdir -p "$HOME"
          "$b" --version
          "$b" --theme
          out=$("$b" --demo)
          echo "$out" | grep -q ctx
          now=$(date +%s)
          in='{"model":{"display_name":"Opus"},"context_window":{"context_window_size":200000,"used_percentage":30},"rate_limits":{"five_hour":{"used_percentage":36,"resets_at":'$((now+3600))'}}}'
          out=$(echo "$in" | "$b")
          echo "$out" | grep -q 36%
          sleep 1
          out=$(echo "$in" | "$b")
          echo "$out" | tail -n 1 | grep -q cpu
          test "$("$b" --bench 50 | grep -c '^  [^ ].* ms')" -eq 8
          "$b" --install
          grep -q '"statusLine"' "$HOME/.claude/settings.json"
          "$b" --uninstall
          if grep -q '"statusLine"' "$HOME/.claude/settings.json"; then exit 1; fi
          : > "$HOME/.claude/settings.json"
          "$b" --install
          grep -q '"statusLine"' "$HOME/.claude/settings.json"
          ext=""
          [ "$RUNNER_OS" = Windows ] && ext=.exe
          mkdir -p "$HOME/.claude/bin"
          cp "$b" "$HOME/.claude/bin/statusline$ext"
          "$HOME/.claude/bin/statusline$ext" --install
          grep -q "\"~/.claude/bin/statusline$ext\"" "$HOME/.claude/settings.json"
          plain=$(NO_COLOR=1 "$b" --demo)
          dumb=$(env -u NO_COLOR TERM=dumb "$b" --demo)
          colored=$(env -u NO_COLOR TERM=xterm-256color "$b" --demo)
          case "$plain$dumb" in *$'\033'*) exit 1 ;; esac
          case "$colored" in *$'\033'*) ;; *) exit 1 ;; esac
          echo "$plain" | grep -q ctx
          out=$(printf '{"model":{"display_name":"Op\377us"},"context_window":{"context_window_size":200000,"used_percentage":30}}' | "$b")
          echo "$out" | grep -q 60k/200k
          echo "$out" | grep -q 'Op.*us'
          if [ "$RUNNER_OS" != Windows ]; then
            account_home=$(eval echo "~$(id -un)")
            out=$(env -u HOME "$b" --check)
            case "$out" in "$account_home/.claude/statusline.json"*) ;; *) echo "$out"; exit 1 ;; esac
          fi
          set +e
          "$b" --no-such-flag 2>/dev/null
          [ $? -eq 2 ] || exit 1
          "$b" --bench abc 2>/dev/null
          [ $? -eq 2 ] || exit 1
          mkdir -p "$RUNNER_TEMP/u/.claude/settings.json"
          HOME="$RUNNER_TEMP/u" USERPROFILE="$RUNNER_TEMP/u" "$b" --uninstall 2>/dev/null
          [ $? -eq 1 ]

      - name: language
        run: |
          b="dist/${{ matrix.asset }}"
          export HOME="$RUNNER_TEMP/h" USERPROFILE="$RUNNER_TEMP/h" LOCALAPPDATA="$RUNNER_TEMP/h/local" XDG_STATE_HOME="$RUNNER_TEMP/h/state"
          mkdir -p "$HOME"
          unset LANGUAGE LC_ALL LC_MESSAGES LANG STATUSLINE_LANG
          english="With no argument"
          french="Sans argument"
          expect() {
            want="$1"; shift
            help=$(env "$@" "$b" --help)
            case "$help" in *"$want"*) ;; *) echo "$* --help lacks: $want"; exit 1 ;; esac
            demo=$(env "$@" "$b" --demo)
            case "$demo" in *ctx*) ;; *) echo "$* --demo lacks ctx"; exit 1 ;; esac
          }
          expect "$french" STATUSLINE_LANG=fr
          expect "$english" STATUSLINE_LANG=en
          if [ "$RUNNER_OS" != Windows ]; then
            expect "$french" LANG=fr_FR.UTF-8
            expect "$english" LANG=C
          fi

      - name: measured values
        run: |
          b="dist/${{ matrix.asset }}"
          export HOME="$RUNNER_TEMP/v" USERPROFILE="$RUNNER_TEMP/v" LOCALAPPDATA="$RUNNER_TEMP/v/local" XDG_STATE_HOME="$RUNNER_TEMP/v/state"
          mkdir -p "$HOME"
          escape=$(printf '\033')
          plain() { LC_ALL=C sed "s/${escape}\[[0-9;]*m//g"; }
          now=$(date +%s)
          full='{"model":{"id":"claude-opus-5","display_name":"Opus 5"},"effort":{"level":"max"},"context_window":{"context_window_size":1000000,"used_percentage":34,"current_usage":{"input_tokens":12000,"cache_creation_input_tokens":48000,"cache_read_input_tokens":280000}},"rate_limits":{"five_hour":{"used_percentage":36,"resets_at":'$((now+12600))'},"seven_day":{"used_percentage":61,"resets_at":'$((now+320400))'}}}'
          short='{"model":{"display_name":"Sonnet"},"context_window":{"context_window_size":200000,"used_percentage":85}}'
          echo "$full" | "$b" > /dev/null
          sleep 1
          out=$(echo "$full" | "$b" | plain)
          printf '%s\n' "$out"
          first=$(echo "$out" | head -n 1)
          last=$(echo "$out" | tail -n 1)
          echo "$first" | grep -Eq 'ctx .*340k/1M'
          echo "$first" | grep -Eq '5h .*36% 3h(29|30)m'
          echo "$first" | grep -Eq '7d .*61% 3d1[67]h'
          echo "$first" | grep -Eq 'Opus 5:max'
          ram=$(echo "$last" | sed -En 's/.*ram .* ([0-9]+\.[0-9])\/([0-9]+\.[0-9])G.*/\1 \2/p')
          [ -n "$ram" ] || { echo "ram value missing"; exit 1; }
          echo "$last" | grep -Eq 'cpu .* [0-9]+%' || { echo "cpu value missing"; exit 1; }
          used=${ram% *}
          total=${ram#* }
          case "$RUNNER_OS" in
            Linux) bytes=$(free -b | awk '/^Mem:/ {print $2}') ;;
            macOS) bytes=$(sysctl -n hw.memsize) ;;
            *) bytes="" ;;
          esac
          if [ -n "$bytes" ]; then
            awk -v shown="$total" -v bytes="$bytes" 'BEGIN { d = shown - bytes / 1073741824; if (d < 0) d = -d; exit !(d <= 0.05 + 1e-9) }' || { echo "total ram $total does not match $bytes bytes"; exit 1; }
          fi
          awk -v used="$used" -v total="$total" 'BEGIN { exit !(used <= total) }'
          out=$(echo "$short" | "$b" | plain)
          echo "$out" | head -n 1 | grep -Eq 'ctx .*170k/200k'

      - name: memory limit
        if: runner.os == 'Linux'
        run: |
          out=$(sudo systemd-run --quiet --scope -p MemoryMax=512M "dist/${{ matrix.asset }}" --demo)
          echo "$out" | grep -q '/0\.5G'

      - name: installer
        run: |
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          ext=""
          [ "$RUNNER_OS" = Windows ] && ext=.exe
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          line='  "statusLine": {\n    "type": "command",\n    "command": "~/.claude/bin/statusline'$ext'",\n    "refreshInterval": 3\n  }\n'
          printf '{\n  "model": "opus",\n  "env": {\n    "B": "1",\n    "A": "2"\n  },\n'"$line"'}\n' > "$RUNNER_TEMP/main.json"
          printf '{\n'"$line"'}\n' > "$RUNNER_TEMP/account.json"
          install_in() {
            label="$1"; built="$2"; shift 2
            root="$RUNNER_TEMP/i-$label"
            mkdir -p "$root/.claude" "$root/.claude-compte2"
            printf '{"model": "opus", "env": {"B": "1", "A": "2"}}' > "$root/.claude/settings.json"
            export HOME="$root"
            if [ "$RUNNER_OS" = Windows ]; then
              export USERPROFILE="$(cygpath -w "$root")" LOCALAPPDATA="$(cygpath -w "$root/local")"
            else
              export XDG_STATE_HOME="$root/state"
            fi
            if [ "$built" = refused ]; then
              cp "$root/.claude/settings.json" "$root/settings.before"
              if "$@" > /dev/null 2> "$root/refusal.log"; then
                echo "install.sh accepted a release without checksums"
                exit 1
              fi
              cat "$root/refusal.log"
              grep -Eq 'download failed|SHA-256 hash' "$root/refusal.log"
              test ! -e "$root/.claude/bin/statusline"
              cmp "$root/settings.before" "$root/.claude/settings.json"
              test ! -e "$root/.claude-compte2/settings.json"
              return 0
            fi
            for run in first second; do
              echo "installer $label, $run run"
              "$@"
              shipped=$("$root/.claude/bin/statusline$ext" --version)
              if [ "$built" = yes ]; then
                test "$shipped" = "statusline $version"
                diff "$RUNNER_TEMP/main.json" "$root/.claude/settings.json"
                diff "$RUNNER_TEMP/account.json" "$root/.claude-compte2/settings.json"
              else
                case "$shipped" in "statusline "[0-9]*) ;; *) echo "$shipped"; exit 1 ;; esac
                grep -q '"statusLine"' "$root/.claude/settings.json"
                grep -q '"statusLine"' "$root/.claude-compte2/settings.json"
              fi
              cmp statusline.json "$root/.claude/statusline.json"
            done
          }
          if [ "$RUNNER_OS" = Windows ]; then
            install_in powershell yes powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 -Build
            install_in pwsh yes pwsh -NoProfile -File ./install.ps1 -Build
          else
            install_in sh yes sh install.sh
            nocargo=$(
              hash -r
              for _ in 1 2 3 4 5 6 7 8; do
                command -v cargo > /dev/null || break
                folder=$(dirname "$(command -v cargo)")
                PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -vxF "$folder" | paste -sd: -)
                hash -r
              done
              printf '%s' "$PATH"
            )
            PATH="$nocargo" command -v cargo > /dev/null && exit 1
            sums="https://github.com/LetermeFlorent/claude-statusline/releases/latest/download/SHA256SUMS"
            if curl -fsIL --proto =https -o /dev/null "$sums"; then
              release=no
            else
              release=refused
            fi
            echo "latest release install: $release"
            install_in release "$release" env LC_ALL=C PATH="$nocargo" sh install.sh
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  toolchain:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        channel: [stable, beta]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.channel }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --no-self-update --profile minimal

      - name: unit tests
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-Cdebuginfo=0' || '' }}
        run: cargo test --locked -- --include-ignored

      - name: release build
        run: cargo build --release --locked

      - name: binary smoke test
        run: |
          ext=""
          [ "$RUNNER_OS" = Windows ] && ext=.exe
          export HOME="$RUNNER_TEMP/h" USERPROFILE="$RUNNER_TEMP/h" LOCALAPPDATA="$RUNNER_TEMP/h/local" XDG_STATE_HOME="$RUNNER_TEMP/h/state"
          mkdir -p "$HOME"
          out=$(target/release/statusline$ext --demo)
          echo "$out" | grep -q ctx

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: sha256sum statusline-* > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: dist/SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          notes="Status line binaries for Linux, macOS and Windows. SHA256SUMS holds their SHA-256 checksums, and each file carries a build provenance attestation: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "$notes"
