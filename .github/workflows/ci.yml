name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: statusline-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: statusline-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: statusline-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: statusline-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: statusline-windows-x86_64.exe
            test_rustflags: -Cdebuginfo=0
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: version du tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" = "$GITHUB_REF_NAME"

      - run: rustup target add ${{ matrix.target }}

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        env:
          RUSTFLAGS: ${{ matrix.test_rustflags }}
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: tests unitaires
        env:
          RUSTFLAGS: ${{ matrix.test_rustflags }}
        run: cargo test --locked --target ${{ matrix.target }}

      - name: binaire
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir dist
          ext=""
          [ "$RUNNER_OS" = Windows ] && ext=.exe
          cp "target/${{ matrix.target }}/release/statusline$ext" "dist/${{ matrix.asset }}"
          ls -l dist

      - name: essai du binaire
        run: |
          b="dist/${{ matrix.asset }}"
          export HOME="$RUNNER_TEMP/h" USERPROFILE="$RUNNER_TEMP/h" LOCALAPPDATA="$RUNNER_TEMP/h/local" XDG_STATE_HOME="$RUNNER_TEMP/h/state"
          mkdir -p "$HOME"
          "$b" --version
          "$b" --theme
          out=$("$b" --demo)
          echo "$out" | grep -q ctx
          now=$(date +%s)
          in='{"model":{"display_name":"Opus"},"context_window":{"context_window_size":200000,"used_percentage":30},"rate_limits":{"five_hour":{"used_percentage":36,"resets_at":'$((now+3600))'}}}'
          out=$(echo "$in" | "$b")
          echo "$out" | grep -q 36%
          sleep 1
          out=$(echo "$in" | "$b")
          echo "$out" | tail -n 1 | grep -q cpu
          "$b" --bench 50
          "$b" --install
          grep -q '"statusLine"' "$HOME/.claude/settings.json"
          "$b" --uninstall
          if grep -q '"statusLine"' "$HOME/.claude/settings.json"; then exit 1; fi
          ext=""
          [ "$RUNNER_OS" = Windows ] && ext=.exe
          mkdir -p "$HOME/.claude/bin"
          cp "$b" "$HOME/.claude/bin/statusline$ext"
          "$HOME/.claude/bin/statusline$ext" --install
          grep -q "\"~/.claude/bin/statusline$ext\"" "$HOME/.claude/settings.json"
          set +e
          "$b" --inconnu 2>/dev/null
          [ $? -eq 2 ]

      - name: installeur
        if: runner.os != 'Windows'
        run: |
          # rustup cherche sa chaine dans le HOME d'origine
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export HOME="$RUNNER_TEMP/i"
          mkdir -p "$HOME/.claude-compte2"
          sh install.sh
          grep -q '"~/.claude/bin/statusline"' "$HOME/.claude/settings.json"
          grep -q '"~/.claude/bin/statusline"' "$HOME/.claude-compte2/settings.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Binaires de la barre pour Linux, macOS et Windows."
